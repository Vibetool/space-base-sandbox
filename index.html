<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星际基地 · 沙盒建造</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1b1e2bf2;
    --panel-border: #2e3350;
    --accent: #7b6cff;
    --accent2: #ffa63d;
    --text: #e8e9f5;
    --muted: #8d92b3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: var(--text); }
  #app { position: fixed; inset: 0; }
  canvas.game { display: block; }

  /* 顶部工具栏 */
  #toolbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    max-width: calc(100vw - 24px);
    display: flex; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(8px);
    z-index: 10; box-shadow: 0 4px 24px #0008;
  }
  #toolbar .title { font-weight: 700; font-size: 14px; margin-right: 6px; letter-spacing: 1px; white-space: nowrap; }
  @media (max-width: 1100px) {
    #toolbar .title, #toolbar .title + .sep { display: none; }
  }
  #toolbar .title span { color: var(--accent2); }
  .btn {
    background: #262a3e; color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .btn:hover { background: #323752; border-color: var(--accent); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger.active { background: #e5484d; border-color: #e5484d; }
  .sep { width: 1px; height: 22px; background: var(--panel-border); margin: 0 2px; }

  /* 左侧调色板 */
  #palette {
    position: fixed; top: 70px; left: 12px; bottom: 46px; width: 292px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; backdrop-filter: blur(8px); z-index: 10;
    display: flex; flex-direction: column; box-shadow: 0 4px 24px #0008;
    transition: width .15s;
  }
  /* 道路分类:面板加宽,卡片更大更清楚 */
  #palette.road-mode { width: 400px; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 10px 6px; }
  #tabs .tab {
    flex: none; font-size: 12px; padding: 5px 10px; border-radius: 7px;
    background: #262a3e; cursor: pointer; border: 1px solid transparent; color: var(--muted);
  }
  #tabs .tab:hover { color: var(--text); }
  #tabs .tab.active { background: var(--accent); color: #fff; }
  #subtabs {
    display: none; flex-wrap: wrap; gap: 4px; padding: 0 10px 6px;
    border-bottom: 1px solid var(--panel-border); margin-bottom: 2px;
  }
  #subtabs .tab.sub { font-size: 11px; padding: 4px 9px; background: #1e2233; }
  #subtabs .tab.sub.active { background: var(--accent2); color: #1b1e2b; font-weight: 600; }
  #items {
    flex: 1; overflow-y: auto; padding: 8px 10px 12px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start;
  }
  /* 道路:两列大卡,间距充足;一屏可见 6~8 张,每张都清晰 */
  #items.wide { grid-template-columns: repeat(2, 1fr); gap: 18px; padding: 16px 16px 24px; }
  #items.wide .item { border-radius: 14px; aspect-ratio: 1; background: #1a1e2e; }
  #items.wide .item img { padding: 3px; }
  #items.wide .item .name { font-size: 12px; padding: 4px 6px; }
  #items::-webkit-scrollbar { width: 8px; }
  #items::-webkit-scrollbar-thumb { background: #33385a; border-radius: 4px; }
  .item {
    background: #22263a; border: 2px solid transparent; border-radius: 10px;
    cursor: pointer; overflow: hidden; position: relative; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .item:hover { border-color: #4a5080; }
  .item.selected { border-color: var(--accent2); box-shadow: 0 0 12px #ffa63d55; }
  .item img { width: 100%; height: 100%; object-fit: contain; }
  .item .ph { color: #4a5080; font-size: 20px; }
  .item .name {
    position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px;
    background: #000a; padding: 2px 4px; text-align: center; color: #cfd2e8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 底部状态栏 */
  #status {
    position: fixed; left: 12px; right: 12px; bottom: 10px; z-index: 10;
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 12px; color: var(--muted); pointer-events: none;
  }
  #status .hint b { color: var(--text); font-weight: 600; }
  #status .msg { color: var(--accent2); font-weight: 600; }

  /* 吸附提示浮标 */
  #snapTip {
    position: fixed; z-index: 11; pointer-events: none; display: none;
    background: #0ea5e9; color: #fff; font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px; transform: translate(-50%, -160%);
    box-shadow: 0 2px 12px #0ea5e988;
  }
  #snapTip.replace { background: #10b981; box-shadow: 0 2px 12px #10b98188; }

  #loading {
    position: fixed; inset: 0; z-index: 99; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #loading .bar { width: 240px; height: 6px; background: #262a3e; border-radius: 3px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  #loading p { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="toolbar">
    <div class="title">🛰️ 星际基地 <span>沙盒建造</span></div>
    <div class="sep"></div>
    <button class="btn active" id="modeBuild">🔨 建造</button>
    <button class="btn danger" id="modeDelete">🗑️ 拆除</button>
    <div class="sep"></div>
    <button class="btn" id="rotBtn">↻ 旋转 (R)</button>
    <button class="btn" id="genBtn">🗺️ 生成地图</button>
    <div class="sep"></div>
    <button class="btn" id="saveBtn">💾 保存</button>
    <button class="btn" id="loadBtn">📂 载入</button>
    <button class="btn" id="clearBtn">🧹 清空</button>
  </div>

  <div id="palette">
    <div id="tabs"></div>
    <div id="subtabs"></div>
    <div id="items"></div>
  </div>

  <div id="status">
    <div class="hint">
      <b>左键</b> 放置 · <b>R</b> 旋转 · <b>右键点击</b> 拆除 · <b>右键拖拽</b> 转视角 ·
      <b>WASD/中键</b> 平移 · <b>滚轮</b> 缩放 · <b>双击门</b> 开/关 · <b>Esc</b> 取消
    </div>
    <div class="msg" id="statusMsg"></div>
  </div>

  <div id="snapTip"></div>

  <div id="loading">
    <p style="font-size:20px;font-weight:700;color:var(--text)">🛰️ 星际基地 · 沙盒建造</p>
    <div class="bar"><i id="loadFill"></i></div>
    <p id="loadText">正在加载模块…</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
